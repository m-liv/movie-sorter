<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Barbie Movie Sorter</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #leftField, #rightField, .middleField {
      border: 1px solid black;
      padding: 20px;
      width: 200px;
      cursor: pointer;
      display: inline-block;
      margin: 10px;
    }
  </style>
</head>
<body>

<h2 id="battleNumber">Loading...</h2>

<div>
  <div id="leftField" onclick="if(finishFlag==0) sortList(-1);"></div>
  <div class="middleField" onclick="if(finishFlag==0) sortList(0);">I Like Both / No Opinion</div>
  <div id="rightField" onclick="if(finishFlag==0) sortList(1);"></div>
</div>

<div id="resultField"></div>

<script src="sorter.js"></script>

</body>
</html>
